[project]
name = "arabic-legal-rag"
version = "0.1.0"
description = "Track 2 - Arabic Legal Document Q&A / RAG. Day 1: PDF -> structured JSON ingestion. Day 2: chunking -> embeddings -> vector store -> retrieval -> FastAPI /ask."
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11.0",
    "pypdf>=4.0.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Day 2 RAG/API extras. NOT installable in this development sandbox (no
# network access here) -- required in a real dev/deploy environment for
# the real embedding model, Chroma backend, and the FastAPI app/tests.
rag = [
    "sentence-transformers>=2.2",
    "chromadb>=0.4",
]
api = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "uvicorn>=0.27",
    "httpx>=0.27",  # needed by fastapi.testclient.TestClient
]
# Day 3 extras. Also NOT installable in this sandbox (no network).
serving = ["bentoml>=1.2"]
load = ["locust>=2.20"]
# Day 4 extra. Also NOT installable in this sandbox (no network).
experiments = ["mlflow>=2.13,<3"]  # pyfunc code_paths + registry aliases (2.x API)

# Day 6 extra: CI lint tool. NOT installable in this sandbox (no network).
lint = ["ruff>=0.4"]
# Day 7 extras. Also NOT installable in this sandbox (no network).
dvc = ["dvc>=3.0"]
ragas = [
    "ragas>=0.2.6,<0.3",  # integration written for the 0.2.x API (EvaluationDataset, ResponseRelevancy, ...)
    "datasets>=2.14",
    "langchain-openai>=0.1",  # judge LLM client (OpenAI-compatible, e.g. vLLM)
    "langchain-core>=0.2",
]
# Day 8 extra, added during the Day-10 portability audit (was previously
# used in src/observability/langfuse_adapter.py without a declared extra
# -- a real packaging gap, now fixed). NOT installable in this sandbox.
langfuse = ["langfuse>=2.0"]

[project.scripts]
ingest-civil-code = "src.ingestion.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Day 6: minimal, non-strict lint config -- catches real errors
# (undefined names, unused imports) without imposing a style rewrite on
# five days of existing code. Not run in this sandbox (`ruff` not
# installed, no network); runs for real in CI (see .github/workflows/ci.yml).
[tool.ruff.lint]
select = ["E9", "F"]  # syntax errors + pyflakes (undefined names, unused imports/vars)

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
