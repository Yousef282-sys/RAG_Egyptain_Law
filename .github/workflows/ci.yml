name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and corpus quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -e ".[dev,rag,api,serving,load,experiments,lint]"

      - name: Lint
        run: python -m ruff check .

      - name: Corpus quality gate
        run: python scripts/check_corpus_quality.py

  ragas-quality-gate:
    name: Optional RAGAS evaluation
    needs: test
    if: vars.ENABLE_RAGAS_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install RAGAS dependencies
        run: python -m pip install -e ".[rag,ragas]"
      - name: Evaluate faithfulness
        run: python scripts/ragas_gate.py
        env:
          RAGAS_FAITHFULNESS_THRESHOLD: "0.75"
          EMBEDDING_BACKEND: sentence-transformers
          GENERATION_MODEL: ${{ vars.GENERATION_MODEL }}
          VLLM_BASE_URL: ${{ vars.VLLM_BASE_URL }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          RAGAS_JUDGE_MODEL: ${{ vars.RAGAS_JUDGE_MODEL }}
          RAGAS_JUDGE_BASE_URL: ${{ vars.RAGAS_JUDGE_BASE_URL }}
          RAGAS_JUDGE_API_KEY: ${{ secrets.RAGAS_JUDGE_API_KEY }}

  dvc-pipeline:
    name: Optional DVC pipeline
    if: vars.ENABLE_DVC_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install DVC
        run: python -m pip install -e ".[dvc]"
      - name: Verify source PDF
        run: |
          test -f data/raw/civil_code.pdf || {
            echo "Required file data/raw/civil_code.pdf is missing."
            echo "Configure DVC remote storage before enabling this job."
            exit 1
          }
      - name: Reproduce pipeline
        run: dvc repro
      - name: Check DVC status
        run: dvc status

