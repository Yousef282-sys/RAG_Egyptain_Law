# CI for the Arabic Legal RAG project.
#
# IMPORTANT: this workflow is written to run on GitHub's own runners
# (which have normal network access), NOT in the sandbox that authored
# it. This sandbox has no network access and no `git remote` configured
# (confirmed: `git remote -v` is empty, and a direct request to
# github.com is denied by this sandbox's network policy) -- so this
# workflow has NEVER actually executed on GitHub. Its structure is
# validated locally with PyYAML (tests/test_ci_workflow.py) and the
# scripts it calls (scripts/check_corpus_quality.py, scripts/ragas_gate.py)
# were run for real locally and their actual exit codes/output are
# recorded in PROGRESS.md -- but "this workflow passes/fails on GitHub"
# is not something this sandbox can honestly claim either way.
name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    name: Lint, tests, corpus quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Installs via the project's own pyproject.toml config -- no
      # separate/duplicate dependency list. Pulls in every optional extra
      # so the currently-sandbox-skipped tests (API, BentoML, Locust,
      # experiments) get a real chance to execute here, on a runner that
      # actually has network access.
      #
      # Day 7 fix: `lint` used to be installed via a separate, hand-written
      # `pip install ruff` step instead of through this same extras
      # mechanism -- inconsistent with every other dependency in this
      # workflow, and a source of version drift. Folded in.
      - name: Install project (all extras)
        run: pip install -e ".[dev,rag,api,serving,load,experiments,lint]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run test suite (pytest)
        run: pytest -q

      - name: Run test suite (bespoke runner, sandbox-parity check)
        run: python3 run_tests.py

      - name: Corpus quality gate
        run: python3 scripts/check_corpus_quality.py

  ragas-quality-gate:
    name: RAGAS faithfulness gate (required -- see scripts/ragas_gate.py)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install project
        run: pip install -e "."
      # Day 7 fix: was `pip install ragas datasets` as a hand-written,
      # unpinned pair -- now goes through the project's own `ragas`
      # extra like every other dependency here. `|| true`: this install
      # is allowed to fail -- the gate script itself must still run and
      # report honestly either way, never silently skipped.
      - name: Attempt real RAGAS evaluation (still fails closed here -- see script docstring for why)
        run: |
          pip install -e ".[ragas]" || true
          python3 scripts/ragas_gate.py
        env:
          RAGAS_FAITHFULNESS_THRESHOLD: "0.7"
      # This job is EXPECTED to fail as of Day 6: the pipeline has no
      # real generation backend yet (retrieval-only by design through
      # Day 5), so scripts/ragas_gate.py fails closed regardless of
      # whether `ragas` itself installs successfully. This is documented,
      # intentional, fail-closed behavior for a required release check --
      # not a workflow bug to silence. See README "RAGAS gate activation".

  dvc-pipeline:
    name: DVC pipeline (dvc repro) -- currently blocked, see step below
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # Day 7 fix: was a hand-written `pip install "dvc>=3.0"` -- now
      # goes through the project's own `dvc` extra, same reasoning as
      # the ragas fix above.
      - name: Install dvc
        run: pip install -e ".[dvc]"
      - name: Check source PDF is present in this checkout
        run: |
          if [ ! -f data/raw/civil_code.pdf ]; then
            echo "BLOCKED: data/raw/civil_code.pdf is not present in this checkout."
            echo "It is git-ignored (.gitignore, since Day 2/3, for size reasons)"
            echo "and no DVC remote is configured to fetch it -- Day 5"
            echo "intentionally did not add remote storage. A fresh clone/CI"
            echo "checkout therefore has no way to obtain the tracked PDF yet."
            echo "This is a required-but-currently-blocked check, reported"
            echo "explicitly rather than silently skipped or passed."
            exit 1
          fi
      - name: dvc repro
        run: dvc repro
      - name: dvc status
        run: dvc status
      # Reaching this point requires the PDF-presence check above to
      # pass, which -- given the current .gitignore + no-DVC-remote
      # setup -- it will not, on a genuinely fresh checkout. Configuring
      # a DVC remote (or committing the PDF, which would defeat the
      # point of tracking it with DVC) is exact Day 7+ scope, not done
      # here. See README "DVC status and limitations".
