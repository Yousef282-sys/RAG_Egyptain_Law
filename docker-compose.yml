services:
  indexer:
    build: .
    command:
      - python
      - -c
      - "from src.rag.vector_store import build_index_from_json; print(build_index_from_json('data/processed/civil_code.json', '/index'))"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
      HF_HOME: /hf_cache
    volumes:
      - vector_store:/index
      - hf_cache:/hf_cache
    restart: "no"

  api:
    build: .
    depends_on:
      indexer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      VECTOR_STORE_DIR: /index
      RAG_TOP_K: ${RAG_TOP_K:-5}
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8001/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
      HF_HOME: /hf_cache
    volumes:
      - vector_store:/index
      - hf_cache:/hf_cache

  vllm:
    profiles:
      - gpu
    image: vllm/vllm-openai:latest
    command:
      - --model
      - ${GENERATION_MODEL:-}
      - --port
      - "8001"
    ports:
      - "8001:8001"
    ipc: host
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

volumes:
  vector_store:
  hf_cache:
