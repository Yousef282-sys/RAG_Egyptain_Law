# Arabic Legal RAG -- API + one-shot indexer + optional vLLM server.
#
# UNVERIFIED: not run in the development sandbox (no docker, no GPU, no
# network). Structure is checked by tests/test_docker_config.py only.
#
#   docker compose up --build                 # indexer + api (retrieval-only unless GENERATION_MODEL set)
#   GENERATION_MODEL=<hf-model> docker compose --profile gpu up --build
#                                             # + vLLM server (needs NVIDIA GPU + container toolkit)
#
# The vector index lives in the named volume `vector_store`, built by the
# `indexer` service from data/processed/civil_code.json (not baked into the
# image). The API image is the repo Dockerfile.
services:
  indexer:
    build: .
    command: >
      python -c "from src.rag.vector_store import build_index_from_json;
      print(build_index_from_json('data/processed/civil_code.json', '/index'))"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - vector_store:/index
    restart: "no"

  api:
    build: .
    depends_on:
      indexer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      VECTOR_STORE_DIR: /index
      RAG_TOP_K: ${RAG_TOP_K:-5}
      # Leave GENERATION_MODEL empty for labelled retrieval-only mode.
      GENERATION_MODEL: ${GENERATION_MODEL:-}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8001/v1}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
    volumes:
      - vector_store:/index:ro

  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    command: ["--model", "${GENERATION_MODEL:?set GENERATION_MODEL to the model to serve}", "--port", "8001"]
    ports:
      - "8001:8001"
    ipc: host
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  vector_store:
  hf_cache:
